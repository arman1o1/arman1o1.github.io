<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Weight-Space Programming PINN Lab</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #07080d; color: #e6ebf5;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 12px;
  }
  .wrap {
    display: flex; flex-direction: column; width: 100%; height: 100%; padding: 10px 12px; gap: 8px;
  }
  .topbar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;
    padding: 7px 10px; border-radius: 9px;
    background: rgba(18, 21, 32, 0.92); border: 1px solid rgba(255,255,255,0.1);
  }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab {
    background: rgba(255,255,255,0.06); color: #b9c3d6; border: 1px solid rgba(255,255,255,0.1);
    padding: 4px 10px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 11px;
    transition: all 0.15s ease;
  }
  .tab:hover { background: rgba(255,255,255,0.12); color: #fff; }
  .tab.active {
    background: #2563eb; border-color: #60a5fa; color: #fff;
  }
  .slider-box { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
  .slider-box input[type=range] { width: 130px; accent-color: #60a5fa; cursor: pointer; }
  .main-grid {
    flex: 1; min-height: 0; display: grid; grid-template-columns: 1.55fr 1fr; gap: 10px;
  }
  .left-col, .right-col {
    display: flex; flex-direction: column; gap: 8px; min-height: 0;
  }
  .card {
    background: rgba(15, 18, 28, 0.92); border: 1px solid rgba(255,255,255,0.09);
    border-radius: 9px; padding: 8px 10px; display: flex; flex-direction: column; min-height: 0;
  }
  .card-title {
    font-size: 11px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px;
    display: flex; justify-content: space-between; align-items: center; gap: 6px;
  }
  .badge {
    font-size: 10px; padding: 1px 6px; border-radius: 4px; font-weight: 600;
    background: rgba(96, 165, 250, 0.16); color: #93c5fd; font-variant-numeric: tabular-nums;
  }
  .heatmaps {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; flex: 1; min-height: 0;
  }
  .hm-cell {
    display: flex; flex-direction: column; gap: 4px; min-height: 0;
  }
  .hm-label {
    font-size: 10px; color: #94a3b8; display: flex; justify-content: space-between;
    font-variant-numeric: tabular-nums;
  }
  .hm-label strong { color: #e2e8f0; }
  canvas { width: 100%; height: 100%; display: block; border-radius: 6px; background: #04050a; }
  .canvas-box { flex: 1; min-height: 0; position: relative; }
  .legend {
    display: flex; gap: 10px; flex-wrap: wrap; font-size: 10px; color: #94a3b8; margin-top: 4px;
  }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  @media (max-width: 720px) {
    .main-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="tabs" id="tabs">
      <button class="tab active" data-mode="advection">1D Advection (L2=0.0015)</button>
      <button class="tab" data-mode="wave">1D Wave</button>
      <button class="tab" data-mode="heat">1D Heat</button>
      <button class="tab" data-mode="patch">Surgical Patch (0.68%)</button>
    </div>
    <div class="slider-box">
      <label for="tSlider">Slice <strong>t</strong> = <span id="tVal">0.50</span></label>
      <input type="range" id="tSlider" min="0" max="31" value="16" />
    </div>
  </div>

  <div class="main-grid">
    <div class="left-col">
      <div class="card" style="flex: 1.15;">
        <div class="card-title">
          <span id="hmTitle">Space-Time Solution u(x, t) – x horizontal, t vertical</span>
          <span class="badge" id="eqBadge">u_t + 0.5 u_x = 0</span>
        </div>
        <div class="heatmaps">
          <div class="hm-cell">
            <div class="hm-label"><strong id="lbl0">Exact</strong><span id="stat0">Analytical</span></div>
            <div class="canvas-box"><canvas id="hm0"></canvas></div>
          </div>
          <div class="hm-cell">
            <div class="hm-label"><strong id="lbl1">Adam PINN</strong><span id="stat1"></span></div>
            <div class="canvas-box"><canvas id="hm1"></canvas></div>
          </div>
          <div class="hm-cell">
            <div class="hm-label"><strong id="lbl2">Gemini Compiler</strong><span id="stat2"></span></div>
            <div class="canvas-box"><canvas id="hm2"></canvas></div>
          </div>
        </div>
      </div>

      <div class="card" style="flex: 0.9;">
        <div class="card-title">
          <span>1D Spatial Cross-Section u(x, t) at Selected t</span>
          <div class="legend">
            <span><i class="dot" style="background:#f8fafc"></i><em id="leg0">Exact</em></span>
            <span><i class="dot" style="background:#f59e0b"></i><em id="leg1">Adam (1.5k)</em></span>
            <span><i class="dot" style="background:#38bdf8"></i><em id="leg2">Gemini Zero-Shot</em></span>
          </div>
        </div>
        <div class="canvas-box"><canvas id="sliceCanvas"></canvas></div>
      </div>
    </div>

    <div class="right-col">
      <div class="card" style="flex: 1;">
        <div class="card-title">
          <span>Layer-0 Weight Geometry (w_x, w_t)</span>
          <span class="badge" id="slopeBadge">Slope w_t/w_x</span>
        </div>
        <div class="canvas-box"><canvas id="weightCanvas"></canvas></div>
        <div class="legend" style="margin-top:6px;">
          <span><i class="dot" style="background:#f59e0b"></i>Adam PINN Neurons (32)</span>
          <span><i class="dot" style="background:#38bdf8"></i>Gemini Compiled Neurons</span>
        </div>
      </div>
    </div>
  </div>
</div>

let mode = "advection";
let tIdx = 16;

const tabs = document.querySelectorAll(".tab");
const tSlider = document.getElementById("tSlider");
const tVal = document.getElementById("tVal");

tabs.forEach(btn => {
  btn.addEventListener("click", () => {
    tabs.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    mode = btn.dataset.mode;
    renderAll();
  });
});

tSlider.addEventListener("input", () => {
  tIdx = parseInt(tSlider.value, 10);
  tVal.textContent = (tIdx / 31).toFixed(2);
  renderAll();
});

function colorMap(v) {
  // Diverging blue -> dark -> amber/red for [-1.2, +1.2]
  const c = Math.max(-1, Math.min(1, v / 1.15));
  let r, g, b;
  if (c >= 0) {
    r = 22 + 230 * Math.pow(c, 0.85);
    g = 32 + 135 * Math.pow(c, 1.1) + 35 * Math.sin(c * Math.PI);
    b = 58 + 30 * (1 - c);
  } else {
    const s = -c;
    r = 22 + 18 * (1 - s);
    g = 32 + 150 * Math.pow(s, 0.9);
    b = 58 + 190 * Math.pow(s, 0.75);
  }
  return [r | 0, g | 0, b | 0];
}

function drawHeatmap(canvas, grid) {
  const rect = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(64, Math.floor(rect.width));
  const h = Math.max(64, Math.floor(rect.height));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w; canvas.height = h;
  }
  const ctx = canvas.getContext("2d");
  const N = grid.length;
  const off = document.createElement("canvas");
  off.width = N; off.height = N;
  const octx = off.getContext("2d");
  const img = octx.createImageData(N, N);
  // grid[ix][it]: x along horizontal (col), t along vertical (row, t=0 at bottom)
  for (let row = 0; row < N; row++) {
    const it = N - 1 - row;
    for (let ix = 0; ix < N; ix++) {
      const [r, g, b] = colorMap(grid[ix][it]);
      const p = (row * N + ix) * 4;
      img.data[p] = r; img.data[p + 1] = g; img.data[p + 2] = b; img.data[p + 3] = 255;
    }
  }
  octx.putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(off, 0, 0, w, h);

  // Horizontal line indicating current tIdx
  const yLine = ((N - 1 - tIdx) / (N - 1)) * h;
  ctx.strokeStyle = "rgba(255,255,255,0.75)";
  ctx.lineWidth = 1.5;
  ctx.setLineDash([4, 3]);
  ctx.beginPath();
  ctx.moveTo(0, yLine);
  ctx.lineTo(w, yLine);
  ctx.stroke();
  ctx.setLineDash([]);
}

    ctx.beginPath();
    for (let ix = 0; ix < N; ix++) {
      const x = toX(ix), y = toY(grid[ix][tIdx]);
      if (ix === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }

  plotCurve(g1, "#f59e0b", 2.0, []);
  plotCurve(g2, "#38bdf8", 2.0, []);
  plotCurve(g0, "#f8fafc", 1.8, [5, 4]);
}

function drawWeights(canvas, l0Adam, l0Gemini, slopes) {
  const rect = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(120, Math.floor(rect.width));
  const h = Math.max(120, Math.floor(rect.height));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w; canvas.height = h;
  }
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, w, h);

  const pts = [...l0Adam, ...l0Gemini];
  let maxAbs = 2.0;
  for (const [wx, wt] of pts) {
    maxAbs = Math.max(maxAbs, Math.abs(wx), Math.abs(wt));
  }
  maxAbs *= 1.12;

  const pad = 26;
  const cx = w / 2, cy = h / 2;
  const scale = Math.min(w - 2 * pad, h - 2 * pad) / (2 * maxAbs);

  // Axes
  ctx.strokeStyle = "rgba(255,255,255,0.14)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pad, cy); ctx.lineTo(w - pad, cy);
  ctx.moveTo(cx, pad); ctx.lineTo(cx, h - pad);
  ctx.stroke();

  // Characteristic lines w_t = slope * w_x
  for (const s of slopes) {
    ctx.strokeStyle = "rgba(56, 189, 248, 0.35)";
    ctx.lineWidth = 1.4;
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    ctx.moveTo(cx - maxAbs * scale, cy + s * maxAbs * scale);
    ctx.lineTo(cx + maxAbs * scale, cy - s * maxAbs * scale);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function plotPoints(arr, color, r) {
    for (const [wx, wt] of arr) {
      if (wx === 0 && wt === 0) continue;
      const px = cx + wx * scale;
      const py = cy - wt * scale;
      ctx.strokeStyle = color.replace("1)", "0.28)");
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(px, py); ctx.stroke();

      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
    }
  }

  plotPoints(l0Adam, "rgba(245, 158, 11, 1)", 3.5);
  plotPoints(l0Gemini, "rgba(56, 189, 248, 1)", 3.5);

  ctx.fillStyle = "#94a3b8";
  ctx.font = "10px monospace";
  ctx.fillText("+w_x", w - pad - 24, cy - 6);
  ctx.fillText("+w_t", cx + 6, pad + 8);
}

function renderAll() {
  if (mode === "patch") {
    const p = DATA.patch;
    document.getElementById("eqBadge").textContent = "Edited " + p.metrics.edited;
    document.getElementById("lbl0").textContent = "Exact Wave";
    document.getElementById("stat0").textContent = "Clean L2=" + p.metrics.clean.l2_rel_error.toFixed(3);
    document.getElementById("lbl1").textContent = "Corrupted";
    document.getElementById("stat1").textContent = "L2=" + p.metrics.corrupt.l2_rel_error.toFixed(2);
    document.getElementById("lbl2").textContent = "Patched (8 wts)";
    document.getElementById("stat2").textContent = "L2=" + p.metrics.patched.l2_rel_error.toFixed(2);
    document.getElementById("leg0").textContent = "Exact";
    document.getElementById("leg1").textContent = "Corrupted";
    document.getElementById("leg2").textContent = "Gemini Patched";
    document.getElementById("slopeBadge").textContent = "Wave L0 Geometry";

    drawHeatmap(document.getElementById("hm0"), p.exact);
    drawHeatmap(document.getElementById("hm1"), p.corrupt);
    drawHeatmap(document.getElementById("hm2"), p.patched);
    drawSlice(document.getElementById("sliceCanvas"), p.exact, p.corrupt, p.patched);
    drawWeights(document.getElementById("weightCanvas"), DATA.tasks.wave.l0_adam, DATA.tasks.wave.l0_gemini, [1, -1]);
    return;
  }

  const t = DATA.tasks[mode];
  document.getElementById("eqBadge").textContent = t.eq;
  document.getElementById("lbl0").textContent = "Analytical Exact";
  document.getElementById("stat0").textContent = "Truth";
  document.getElementById("lbl1").textContent = "Adam (1.5k)";
  document.getElementById("stat1").textContent = "L2=" + t.metrics.adam.l2_rel_error.toFixed(4);
  document.getElementById("lbl2").textContent = "Gemini Compiler";
  document.getElementById("stat2").textContent = "L2=" + t.metrics.gemini_code.l2_rel_error.toFixed(4);
  document.getElementById("leg0").textContent = "Exact";
  document.getElementById("leg1").textContent = "Adam (1.5k)";
  document.getElementById("leg2").textContent = "Gemini Compiler";
  document.getElementById("slopeBadge").textContent = t.characteristic_slopes.length
    ? "Char. w_t/w_x = " + t.characteristic_slopes.join(", ")
    : "Diffusive (no char. ray)";

  drawHeatmap(document.getElementById("hm0"), t.exact);
  drawHeatmap(document.getElementById("hm1"), t.adam);
  drawHeatmap(document.getElementById("hm2"), t.gemini_code);
  drawSlice(document.getElementById("sliceCanvas"), t.exact, t.adam, t.gemini_code);
  drawWeights(document.getElementById("weightCanvas"), t.l0_adam, t.l0_gemini, t.characteristic_slopes);
}

window.addEventListener("resize", renderAll);
renderAll();
</script>
